name: assemble-dual-release

# Cloud assembly and acceptance for a draft dual-edition release.
# Inputs are two already compiled candidate ZIPs plus inputs-manifest.json on the
# draft release. The workflow reuses the project's existing packaging scripts,
# verifies the real packaged artifacts, and uploads only to the draft release.
# It never publishes the release and never uses --clobber.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z) matching the draft tag v<version> and inputs-manifest.json
        required: true
        default: '0.7.5'
        type: string
      inputs_sha256:
        description: SHA256 of the inputs-manifest.json asset on that draft release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: assemble-dual-release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  QIF_VERSION: ${{ inputs.version }}
  QIF_INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  assemble:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Set up Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Validate dispatch inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:QIF_VERSION
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "version must be x.y.z: $version" }
          $sha = $env:QIF_INPUTS_SHA256
          if ($sha -notmatch '^[0-9a-fA-F]{64}$') { throw 'inputs_sha256 must be a 64-character hex SHA256' }
          $staging = Join-Path $env:RUNNER_TEMP 'qif-cloud'
          New-Item -ItemType Directory -Force -Path (Join-Path $staging 'input'), (Join-Path $staging 'logs'), (Join-Path $staging 'report') | Out-Null
          "QIF_STAGING=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QIF_INPUTS_SHA256=$($sha.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download candidate ZIPs from the draft release
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:QIF_VERSION"
          $input = Join-Path $env:QIF_STAGING 'input'
          $release = gh release view $tag --json tagName,isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release $tag is not a draft; refusing to touch it" }
          if ($release.tagName -ne $tag) { throw "Unexpected release tag: $($release.tagName)" }
          $finalNames = @(
            "quick-interface-finder-$env:QIF_VERSION-app-windows-x64.zip",
            "quick-interface-finder-$env:QIF_VERSION-extension.zip",
            'app-delivery.json',
            'extension-delivery.json',
            'SHA256SUMS.txt',
            'release-manifest.json',
            'version-choice.md',
            'cloud-verification.json'
          )
          $present = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in $finalNames) { if ($present -contains $name) { throw "Final asset already exists on the draft: $name" } }
          gh release download $tag --dir $input --pattern candidate-app.zip --pattern candidate-extension.zip --pattern inputs-manifest.json
          $downloaded = @(Get-ChildItem -LiteralPath $input -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @('candidate-app.zip', 'candidate-extension.zip', 'inputs-manifest.json')
          if (Compare-Object $downloaded $expected) { throw "Unexpected input files: $($downloaded -join ', ')" }

      - name: Verify manifest, candidate hashes, ZIP CRCs and paths
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $staging = $env:QIF_STAGING
          python scripts/verify_candidates.py `
            --input-dir (Join-Path $staging 'input') `
            --manifest (Join-Path $staging 'input\inputs-manifest.json') `
            --version $env:QIF_VERSION `
            --manifest-sha256 $env:QIF_INPUTS_SHA256 `
            --report (Join-Path $staging 'report\candidate-verification.json')
          $manifest = (Get-Content (Join-Path $staging 'input\inputs-manifest.json') -Raw).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $asar = if ($manifest.appAsarSha256) { $manifest.appAsarSha256 } elseif ($manifest.expectedAppAsarSha256) { $manifest.expectedAppAsarSha256 } else { throw 'inputs-manifest.json missing appAsarSha256' }
          if ($asar -notmatch '^[0-9a-fA-F]{64}$') { throw 'inputs-manifest.json appAsarSha256 is invalid' }
          "QIF_INPUT_APP_ASAR=$($asar.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the CI-only tool manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/set_ci_version.mjs $env:QIF_VERSION
          npm install --no-audit --no-fund --ignore-scripts
          node scripts/check_tools.mjs
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version; print(sys.version)"
          $py = python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          "QIF_PYTHON_VERSION=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage the compiled candidate app
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $staging = $env:QIF_STAGING
          python scripts/stage_candidates.py `
            --app-zip (Join-Path $staging 'input\candidate-app.zip') `
            --version $env:QIF_VERSION `
            --dest build/win-unpacked `
            --expected-asar $env:QIF_INPUT_APP_ASAR `
            --report (Join-Path $staging 'report\candidate-staging.json')
          node scripts/check_asar.mjs `
            --asar build/win-unpacked/resources/app.asar `
            --expect-name quick-interface-finder `
            --expect-version $env:QIF_VERSION `
            --expect-sha256 $env:QIF_INPUT_APP_ASAR

      - name: Assemble both editions with the existing release scripts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $env:QIF_STAGING 'logs\assemble.log'
          node scripts/package_release.mjs --reuse-build --build-dir build --output-dir public-output --python python 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "package_release.mjs failed; see $log" }

      - name: Verify assembled output and same-source manifests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $staging = $env:QIF_STAGING
          python scripts/verify_assembly.py `
            --output public-output `
            --build-dir build/win-unpacked `
            --version $env:QIF_VERSION `
            --expected-asar $env:QIF_INPUT_APP_ASAR `
            --report (Join-Path $staging 'report\assembly-verification.json')

      - name: Stage the final archives for smoke acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $staging = $env:QIF_STAGING
          python scripts/stage_final.py `
            --output public-output `
            --version $env:QIF_VERSION `
            --dest (Join-Path $staging 'smoke') `
            --expected-asar $env:QIF_INPUT_APP_ASAR `
            --report (Join-Path $staging 'report\final-layout.json')
          $layout = Get-Content (Join-Path $staging 'report\final-layout.json') -Raw | ConvertFrom-Json
          "QIF_SMOKE_EXE=$($layout.appExe)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QIF_EXT_RESOURCES=$($layout.extensionResources)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QIF_SMOKE_VERSION=$env:QIF_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QIF_SMOKE_STAGING=$(Join-Path $staging 'smoke-work')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QIF_SMOKE_REPORT_DIR=$(Join-Path $staging 'report')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test the packaged APP
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $env:QIF_STAGING 'logs\packaged-smoke.log'
          node tests/packaged-smoke.mjs 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "packaged app smoke failed; see $log" }

      - name: Download the fixed official Electron 44.7.0 host runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $staging = $env:QIF_STAGING
          python scripts/download_electron.py `
            --version 44.7.0 `
            --dest (Join-Path $staging 'electron') `
            --report (Join-Path $staging 'report\electron.json')
          $electron = Get-Content (Join-Path $staging 'report\electron.json') -Raw | ConvertFrom-Json
          "QIF_HOST_ELECTRON=$($electron.electronExe)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QIF_ELECTRON_SHA256=$($electron.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Hosted extension smoke in the official Electron host
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $staging = $env:QIF_STAGING
          $env:QIF_HOST_STAGING = Join-Path $staging 'host-work'
          $env:QIF_HOST_REPORT_DIR = Join-Path $staging 'report'
          $log = Join-Path $staging 'logs\hosted-smoke.log'
          node tests/hosted-smoke.mjs 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "hosted extension smoke failed; see $log" }

      - name: Re-check the draft release and final asset names
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:QIF_VERSION"
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release $tag is no longer a draft" }
          $present = @($release.assets | ForEach-Object { $_.name })
          $finalNames = @(
            "quick-interface-finder-$env:QIF_VERSION-app-windows-x64.zip",
            "quick-interface-finder-$env:QIF_VERSION-extension.zip",
            'app-delivery.json',
            'extension-delivery.json',
            'SHA256SUMS.txt',
            'release-manifest.json',
            'version-choice.md',
            'cloud-verification.json'
          )
          foreach ($name in $finalNames) { if ($present -contains $name) { throw "Final asset already exists on the draft: $name" } }

      - name: Write cloud-verification.json
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $staging = $env:QIF_STAGING
          Copy-Item -LiteralPath 'public-output\版本选择.md' -Destination 'public-output\version-choice.md'
          node scripts/write_verification.mjs `
            --output public-output `
            --smoke (Join-Path $staging 'report\packaged-smoke.json') `
            --host (Join-Path $staging 'report\hosted-smoke.json') `
            --candidates (Join-Path $staging 'report\candidate-verification.json') `
            --assembly (Join-Path $staging 'report\assembly-verification.json')

      - name: Upload final assets to the draft release without clobbering
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:QIF_VERSION"
          $files = @(
            "public-output\quick-interface-finder-$env:QIF_VERSION-app-windows-x64.zip",
            "public-output\quick-interface-finder-$env:QIF_VERSION-extension.zip",
            'public-output\app-delivery.json',
            'public-output\extension-delivery.json',
            'public-output\SHA256SUMS.txt',
            'public-output\release-manifest.json',
            'public-output\version-choice.md',
            'public-output\cloud-verification.json'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing final asset: $file" }
            if ((Get-Item -LiteralPath $file).Length -ge 2147483648) { throw "Asset exceeds the GitHub 2 GiB per-file limit: $file" }
          }
          gh release upload $tag @files
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          $after = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if (-not $after.isDraft) { throw 'The release is no longer a draft after upload' }
          $names = @($after.assets | ForEach-Object { $_.name })
          foreach ($file in $files) {
            $leaf = Split-Path -Leaf $file
            if ($names -notcontains $leaf) { throw "Uploaded asset not listed on the draft: $leaf" }
          }
          Write-Output 'Uploaded to the draft only. The release was not published.'

      - name: Print the final verification summary
        run: |
          Get-Content -LiteralPath public-output\SHA256SUMS.txt
          Get-Content -LiteralPath public-output\cloud-verification.json

      - name: Show retained logs after a failure
        if: failure()
        run: |
          $staging = $env:QIF_STAGING
          if ($staging -and (Test-Path (Join-Path $staging 'logs'))) {
            Get-ChildItem -LiteralPath (Join-Path $staging 'logs') -File | ForEach-Object {
              Write-Output "===== $($_.Name) ====="
              Get-Content -LiteralPath $_.FullName -Tail 300
            }
          }
          if ($staging -and (Test-Path (Join-Path $staging 'report'))) {
            Get-ChildItem -LiteralPath (Join-Path $staging 'report') -File | ForEach-Object {
              Write-Output "===== report/$($_.Name) ====="
              Get-Content -LiteralPath $_.FullName -Tail 200
            }
          }
          Write-Output 'This run did not publish the release. Inspect the draft assets before retrying; existing assets are never overwritten.'


