name: Assemble 0.5.8 slim full offline trial
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  slim:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Verify original full runtime and versioned slim components
        shell: pwsh
        run: |
          gh release download v0.5.7 -p '*.7z.*' -D base
          if($LASTEXITCODE){throw 'Base download failed'}
          $expected=@{'quick-interface-0.5.7-windows-x64.7z.001'='89d389172c6f83b61b7fe2cde31213742c0e4b91537501ca88f2ad1cae7d97bb';'quick-interface-0.5.7-windows-x64.7z.002'='62ce0b878d6f00e09f4c41f3c3be5b83d4b53e9751f905e11d716e7aac55675d';'quick-interface-0.5.7-windows-x64.7z.003'='27de56f86a94f0c7cc59eef69e995e8aaec6e946ab056f7e11ae1ea10e37acd9'}
          foreach($name in $expected.Keys){if((Get-FileHash (Join-Path base $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$name]){throw 'Base checksum mismatch'}}
          gh release download v0.5.8 -p slim-components.zip
          if($LASTEXITCODE -or (Get-FileHash slim-components.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b30cb99c4039a774ff1f3a068c8e67af647d4df64a061a9e23c69814d1169fb9'){throw 'Component checksum mismatch'}
          Expand-Archive slim-components.zip components
          python -c "import pathlib,json,hashlib; r=pathlib.Path('components'); m=json.loads((r/'manifest.json').read_text(encoding='utf-8')); assert m['version']=='0.5.8'; assert all(not pathlib.PurePosixPath(f['path']).is_absolute() and '..' not in pathlib.PurePosixPath(f['path']).parts and hashlib.file_digest((r/f['path']).open('rb'),'sha256').hexdigest()==f['sha256'] for f in m['files'])"
          if($LASTEXITCODE){throw 'Component inventory mismatch'}
          7z x base/quick-interface-0.5.7-windows-x64.7z.001 -ooriginal -y|Out-Null
          if($LASTEXITCODE){throw 'Base extraction failed'}
          $staging=(Resolve-Path -LiteralPath base).Path
          if($staging -ne (Join-Path $PWD 'base')){throw 'Staging boundary mismatch'}
          Remove-Item -LiteralPath $staging -Recurse -Force
      - name: Baseline CPU search with original bundled Python
        shell: pwsh
        run: |
          & './original/团队便携版/桌面端/resources/worker/python.exe' -I tests/slim_runtime.py --bundle 'original/团队便携版' --cache "$env:RUNNER_TEMP/slim-vector-cache" --fixtures components/fixtures --report baseline-cpu.json
          if($LASTEXITCODE){throw 'Baseline CPU search failed'}
      - name: Copy runtime without development files and preserve every DLL and model
        shell: pwsh
        run: |
          python scripts/package_slim.py --source 'original/团队便携版' --destination 'bundle/团队便携版' --version 0.5.8
          if($LASTEXITCODE){throw 'Slim packaging failed'}
          Copy-Item components/payload/桌面端/resources/app.asar bundle/团队便携版/桌面端/resources/app.asar -Force
          Copy-Item installer/SLIM-README.md bundle/团队便携版/README.md -Force
          Set-Content -Encoding UTF8 'bundle/团队便携版/版本说明.txt' '快速找界面 0.5.8 精简试用版；内置模型与 GPU 加速保留，发行包不含个人项目数据。'
          $staging=(Resolve-Path -LiteralPath original).Path
          if($staging -ne (Join-Path $PWD 'original')){throw 'Staging boundary mismatch'}
          Remove-Item -LiteralPath $staging -Recurse -Force
      - name: Verify CPU image search, semantic search and old index reuse
        shell: pwsh
        run: |
          & './bundle/团队便携版/桌面端/resources/worker/python.exe' -I tests/slim_runtime.py --bundle 'bundle/团队便携版' --cache "$env:RUNNER_TEMP/slim-vector-cache" --fixtures components/fixtures --report slim-cpu.json --baseline baseline-cpu.json
          if($LASTEXITCODE){throw 'Slim CPU search or index reuse failed'}
      - name: Compress complete offline payload with 7-Zip and verify CRC
        shell: pwsh
        run: |
          New-Item -ItemType Directory public|Out-Null
          Push-Location bundle
          7z a -t7z -m0=lzma2 -mx=5 -md=32m -mmt=4 -ms=256m -v1900m '-xr!__pycache__' '-xr!*.pyc' ../public/quick-interface-0.5.8-windows-x64.7z 团队便携版|Out-Null
          if($LASTEXITCODE){throw 'Compression failed'}
          Pop-Location
          7z t public/quick-interface-0.5.8-windows-x64.7z.001|Out-Null
          if($LASTEXITCODE){throw 'CRC verification failed'}
          Copy-Item 'bundle/团队便携版/slim-manifest.json' public/slim-manifest.json
          Copy-Item slim-cpu.json public/slim-cpu-verification.json
          Copy-Item components/local-validation.json public/local-gpu-and-desktop-verification.json
      - name: Build complete offline installer using fixed NSIS tooling
        shell: pwsh
        run: |
          $files=@(
            @{name='nsis-3.0.4.1';hash='9877df902530f96357d13a7a31ae2b9df67f48b11ffc9a1700a7c961574ec5fa'},
            @{name='nsis-resources-3.4.1';hash='593a9a92ef958321293ac6a2ee61e64bf1bd543142a5bd6b3d310709cc924103'}
          )
          foreach($file in $files){
            $archive=$file.name+'.7z'
            curl.exe -fL --retry 3 -sS "https://github.com/electron-userland/electron-builder-binaries/releases/download/$($file.name)/$archive" -o $archive
            if($LASTEXITCODE -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.hash){throw 'Toolchain checksum mismatch'}
            7z x $archive ('-o'+$file.name) -y|Out-Null
            if($LASTEXITCODE){throw 'Toolchain extraction failed'}
          }
          $compiler=(Get-ChildItem nsis-3.0.4.1 -Recurse -Filter makensis.exe|Where-Object {$_.Directory.Name -ne 'Bin'}|Select-Object -First 1).FullName
          $plugins=(Get-ChildItem nsis-resources-3.4.1 -Recurse -Directory|Where-Object {$_.Name -eq 'x86-unicode'}|Select-Object -First 1).FullName
          if(!$compiler -or !$plugins){throw 'Toolchain paths missing'}
          python installer/build.py --bundle 'bundle/团队便携版' --public public --tools components/tools --nsis $compiler --plugins $plugins --version 0.5.8 --offline
          if($LASTEXITCODE){throw 'Offline EXE compilation failed'}
          $staging=(Resolve-Path -LiteralPath bundle).Path
          if($staging -ne (Join-Path $PWD 'bundle')){throw 'Staging boundary mismatch'}
          Remove-Item -LiteralPath $staging -Recurse -Force
      - name: Test actual offline installation, model loading and uninstall
        shell: pwsh
        run: ./installer/verify-installed.ps1 -Offline -Version 0.5.8
      - name: Publish slim full trial, retain 0.5.7 as stable
        shell: pwsh
        run: |
          Copy-Item installer/SLIM-README.md public/README.md
          Copy-Item components/tools/7zip-LICENSE.txt public/7zip-LICENSE.txt
          Copy-Item components/tools/7zip-COPYING public/7zip-COPYING.txt
          $files=@(Get-ChildItem public -File)
          foreach($file in $files){if($file.Length -ge 2GB){throw 'GitHub single file limit exceeded'}}
          $files|ForEach-Object{(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+$_.Name}|Set-Content -Encoding UTF8 public/SHA256SUMS.txt
          $upload=@(Get-ChildItem public -File|ForEach-Object{$_.FullName})
          gh release upload v0.5.8 @upload --clobber
          if($LASTEXITCODE){throw 'Upload failed'}
          gh release edit v0.5.8 --draft=false --prerelease --latest=false --title '快速找界面 0.5.8 · 精简全量试用版'
          if($LASTEXITCODE){throw 'Publish failed'}
          gh release delete-asset v0.5.8 slim-components.zip --yes
          if($LASTEXITCODE){throw 'Temporary component cleanup failed'}
